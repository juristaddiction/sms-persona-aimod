name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: android-actions/setup-android was removed: it tries to install
      # the long-removed 'tools' SDK package and fails. The ubuntu-latest
      # runner already ships an Android SDK (ANDROID_HOME is preset).

      - name: Restore release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
            ls -la release.keystore
          else
            echo "No RELEASE_KEYSTORE_B64 secret; will build debug APK."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-persona-aimod-apk
          path: app/build/outputs/apk/*/*.apk
